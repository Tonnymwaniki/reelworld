<!-- Place page. Follows world_place_page_kicc_nairobi. Removed:

     /api/place: viewpoint groups, clear signs, credits, related places. -->
<div class="flex flex-col gap-1 mb-4">
<nav aria-label="Breadcrumb" class="flex flex-wrap items-center gap-1.5 font-label-sm text-label-sm text-on-surface-variant" id="pl-crumbs"></nav>
<div class="flex flex-wrap items-end justify-between gap-3">

</div>

</button>
<a class="min-h-[44px] px-4 rounded-lg bg-surface-container-high hover:bg-surface-dim text-on-surface font-label-md text-label-md transition-colors inline-flex items-center gap-1.5" href="#/connected" id="pl-connected">
<span class="material-symbols-outlined text-[16px]">hub</span>
<span>Connected</span>
</a>
</div>
</div>
</div>

<div class="h-48 rounded-xl bg-surface-container-low"></div>
</div>
<div class="hidden font-body-md text-body-md text-error" id="pl-error" role="alert"></div>
<div class="flex-col gap-8" id="pl-main" hidden>
<div class="flex-col gap-6" id="pl-sections"></div>

<div class="flex-col gap-2" id="pl-rel-wrap">

</div>
<div class="hidden bg-surface-container-low rounded-xl p-6 text-center flex-col gap-3 items-center" id="pl-empty">
<p class="font-body-md text-body-md text-on-surface-variant" id="pl-empty-text">No photos of this place yet.</p>
<button class="min-h-[44px] px-5 rounded-lg bg-primary-container text-surface hover:bg-primary font-label-md text-label-md transition-colors active:scale-95" id="pl-empty-add" type="button">Add the first photo</button>

</div>

</div>

</div>

<p class="font-body-sm text-body-sm text-on-surface leading-snug" data-slot="cap">—</p>
